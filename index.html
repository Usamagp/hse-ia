<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#14284b">
<title>HSE Improvement Action</title>
<link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;font:16px Arial,sans-serif;background:#14284b;color:#fff">
<div id="l" style="text-align:center;padding:30vh 20px">Loading HSE Improvement Action&hellip;</div>
<script>
// The app itself is kept in the HSE Drive and served by the HSE data server.
var SRC = 'https://script.google.com/macros/s/AKfycbyrm_zsrcA0PTn6cikyrqRwH6ispPM7EKD8DH5-8QmdPmt9fITTcrpTnRyE6SaTUNkZkA/exec?action=html';
function show(h) { document.open(); document.write(h); document.close(); }
fetch(SRC).then(function (r) { return r.text(); }).then(function (h) {
  if (h.indexOf('IA_CONFIG') < 0) throw new Error('bad');
  try { localStorage.setItem('ia_shell', h); } catch (e) {}
  show(h);
}).catch(function () {
  var h = null; try { h = localStorage.getItem('ia_shell'); } catch (e) {}
  if (h) show(h);
  else document.getElementById('l').innerHTML = 'Could not load the app. Check your internet connection.<br><br><button onclick="location.reload()" style="padding:10px 18px;font-size:16px">Try again</button>';
});
</script>
</body>
</html>
